name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run frontend edit-flow tests
        run: node --test frontend_tests/*.test.js

      # :tax and :importers are plain JVM Kotlin, so these need no Android SDK. They check the
      # phone's copy of the tax calculations and of the broker import against the same fixtures the
      # Python tests above use.
      - name: Run Kotlin shared-spec tests
        working-directory: android-app
        run: ./gradlew :tax:test :importers:test --console=plain
